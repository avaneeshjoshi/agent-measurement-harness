[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caliper"
version = "0.1.0"
description = "Caliper: observability and evaluation layer for coding-agent traffic. v0 ships the log extractor."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
caliper = "cli.main:main"

[tool.setuptools]
packages = ["cli", "connectors", "harness", "harness.replay", "harness.classifier", "harness.report"]

[tool.setuptools.package-data]
"harness.replay" = ["pricing.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
