[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "caliper"
version = "0.2.0"
description = "Caliper: observability and evaluation layer for coding-agent traffic."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
# Pinned exactly (ADR-0014): an install today and an install next month from
# the same tag must resolve identically.
dependencies = [
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
caliper = "caliper.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["caliper"]

# The repo's top-level schemas/ is the single source of truth; the wheel
# carries a copy inside the package so an install without a checkout can
# validate records (ADR-0014; resolved by caliper.cli.paths.schema_path).
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "caliper/assets/schemas"

[tool.hatch.build.targets.sdist]
include = ["caliper", "schemas", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
